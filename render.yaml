services:
  - type: web
    name: codeoracle
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeoracle-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: TEST_EXECUTION_ENABLED
        value: "false"
      - key: TEST_EXECUTION_ALLOW_UNTRUSTED
        value: "false"

databases:
  - name: codeoracle-db
    plan: free
    databaseName: codeoracle
    user: codeoracle
