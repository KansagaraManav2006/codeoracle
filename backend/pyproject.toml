[project]
name = "codeoracle-backend"
version = "0.1.0"
description = "CodeOracle Backend API and Code Intelligence Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "pytest>=8.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "tree-sitter>=0.21.3",
    "tree-sitter-javascript>=0.21.0",
    "coverage>=7.6.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
